<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhythmos - Vision Music Player & Teleprompter</title>
  <meta name="description" content="Rhythmos: Vision-based music player featuring gesture hand tracking, acoustic instruments, lyrics teleprompter, and Web Audio synthesis.">
  
  <link rel="stylesheet" href="./src/style.css">
  
  <!-- MediaPipe Hands & Camera Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Fullscreen Camera Stream Layer -->
  <div class="fullscreen-viewport">
    <video id="webcamVideo" playsinline muted></video>
    <canvas id="mainCanvas"></canvas>
  </div>

  <!-- Songbook & Teleprompter Drawer (Left Side) -->
  <aside class="songbook-drawer collapsed" id="songbookDrawer"></aside>

  <!-- Top Navigation Header Bar (Header-03 Glassmorphism Style) -->
  <header class="header-navbar">
    <div class="header-container">
      
      <!-- Brand Logo Block -->
      <div class="nav-brand-block">
        <a href="#" class="brand-link">
          <div class="logo-badge">🎵</div>
          <div class="brand-title">
            <h1>Rhythmos</h1>
            <span>A to G# Scale</span>
          </div>
        </a>
      </div>

      <!-- Navigation Dropdown Items (Header-03 Trigger Design) -->
      <nav class="nav-dropdown-group">
        
        <!-- Dropdown 1: Acoustic Instrument Selector (Shows Selected Instrument at Top!) -->
        <div class="nav-item dropdown">
          <button class="nav-trigger-btn dropdown-toggle" id="instDropdownTrigger">
            <span id="currentInstLabel" class="flex items-center gap-2">
              <span>🪗</span> Harmonium
            </span>
            <span class="chevron-icon">▾</span>
          </button>
          <div class="dropdown-menu inst-dropdown-menu">
            <div class="dropdown-header">Select Instrument</div>
            <div class="timbre-list">
              <button class="inst-btn active" data-inst="harmonium">
                <span>🪗</span> Harmonium
              </button>
              <button class="inst-btn" data-inst="piano">
                <span>🎹</span> Grand Piano
              </button>
              <button class="inst-btn" data-inst="guitar">
                <span>🎸</span> Nylon Guitar
              </button>
              <button class="inst-btn" data-inst="strings">
                <span>🎻</span> Symphonic Strings
              </button>
              <button class="inst-btn" data-inst="marimba">
                <span>🪵</span> Concert Marimba
              </button>
              <button class="inst-btn" data-inst="rhodes">
                <span>⚡</span> Vintage Rhodes
              </button>
              <button class="inst-btn" data-inst="organ">
                <span>⛪</span> Church Organ
              </button>
            </div>
          </div>
        </div>

        <!-- Dropdown 2: Camera & Vision Controls -->
        <div class="nav-item dropdown">
          <button class="nav-trigger-btn dropdown-toggle">
            <span>📹</span> Vision
            <span class="chevron-icon">▾</span>
          </button>
          <div class="dropdown-menu">
            <div class="dropdown-header">Camera Control</div>
            <button id="btnToggleCamera" class="btn-primary" style="margin-bottom: 0.5rem;">
              <span>📹</span> Start Camera
            </button>
            <div class="badge" id="cameraBadge" style="width: 100%; justify-content: center;">
              <span class="badge-dot" id="cameraDot"></span>
              <span id="cameraStatusText">Camera Off</span>
            </div>
          </div>
        </div>

        <!-- Dropdown 3: Octave Range -->
        <div class="nav-item dropdown">
          <button class="nav-trigger-btn dropdown-toggle">
            <span>🎼</span> Octave (<span id="octaveLabel">4</span>)
            <span class="chevron-icon">▾</span>
          </button>
          <div class="dropdown-menu">
            <div class="dropdown-header">Octave Pitch Range</div>
            <div class="octave-bar">
              <button class="oct-btn" data-octave="2">2</button>
              <button class="oct-btn" data-octave="3">3</button>
              <button class="oct-btn active" data-octave="4">4</button>
              <button class="oct-btn" data-octave="5">5</button>
              <button class="oct-btn" data-octave="6">6</button>
            </div>
          </div>
        </div>

        <!-- Dropdown 4: Audio Mix & Reverb -->
        <div class="nav-item dropdown">
          <button class="nav-trigger-btn dropdown-toggle">
            <span>🎚️</span> Audio Mix
            <span class="chevron-icon">▾</span>
          </button>
          <div class="dropdown-menu" style="min-width: 220px;">
            <div class="control-group">
              <div class="control-label">
                <span>Master Volume</span>
                <span id="volVal">85%</span>
              </div>
              <input type="range" id="volSlider" min="0" max="100" value="85">
            </div>
            <div class="control-group" style="margin-top: 0.75rem;">
              <div class="control-label">
                <span>Concert Reverb</span>
                <span id="revVal">35%</span>
              </div>
              <input type="range" id="revSlider" min="0" max="100" value="35">
            </div>
          </div>
        </div>

      </nav>

      <!-- Right Header Actions (Songbook & Audio Test & Status) -->
      <div class="header-actions-group">
        <!-- Songbook Teleprompter Toggle Button -->
        <button id="btnToggleSongbookDrawer" class="nav-action-btn songbook-trigger">
          <span>🎤</span> Songbook Lyrics
        </button>

        <!-- Quick Audio Test -->
        <button id="btnTestAudio" class="nav-action-btn">
          <span>🔔</span> Test Note
        </button>

        <!-- Audio Status Badge -->
        <div class="badge" id="audioBadge">
          <span class="badge-dot" id="audioDot"></span>
          <span id="audioStatusText">Audio Idle</span>
        </div>
      </div>

    </div>
  </header>

  <!-- Hero Splash Screen with Ferrofluid Background -->
  <div class="modal-backdrop" id="startModal">
    <!-- Live Interactive Ferrofluid WebGL Canvas Background -->
    <div id="ferrofluidContainer" class="ferrofluid-modal-bg"></div>

    <!-- Hero Content -->
    <div class="hero-content">
      <!-- Giant Bold Headline -->
      <h1 class="hero-title">Welcome to Rhythmos</h1>

      <p class="hero-subtitle">
        Hover your index finger over the chromatic note wheel on the right side of the screen to play real-time musical notes cleanly in thin air.
      </p>

      <!-- Hero Button Pair -->
      <div class="hero-actions">
        <button id="btnStartApp" class="hero-btn-primary">
          Get started
        </button>
        <button id="btnLearnMore" class="hero-btn-secondary">
          Learn more
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
