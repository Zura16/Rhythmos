<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rhythmos - Vision Music Player & Teleprompter</title>
  <meta name="description" content="Rhythmos: Vision-based music player featuring gesture hand tracking, acoustic instruments, lyrics teleprompter, and Web Audio synthesis.">
  
  <link rel="stylesheet" href="./src/style.css">
  
  <!-- GSAP CDN for React Bits PillNav animations -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" crossorigin="anonymous"></script>

  <!-- MediaPipe Hands & Camera Utils CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Fullscreen Camera Stream Layer -->
  <div class="fullscreen-viewport">
    <video id="webcamVideo" playsinline muted></video>
    <canvas id="mainCanvas"></canvas>
  </div>

  <!-- Songbook & Teleprompter Drawer (Left Side) -->
  <aside class="songbook-drawer collapsed" id="songbookDrawer"></aside>

  <!-- Top Header Navigation Bar with React Bits PillNav Integration -->
  <header class="fixed top-0 bg-background/50 backdrop-blur-md left-0 w-full z-50">
    <div class="px-4">
      <div class="flex items-center justify-between h-20">
        
        <!-- Center React Bits PillNav Navigation Container -->
        <nav id="pillNavContainer" class="pill-nav-main-wrapper"></nav>

        <!-- Right Header CTA Buttons -->
        <div class="hidden gap-2 lg:flex items-center">
          <button id="btnToggleSongbookDrawer" class="btn-cta-header px-6 h-14">
            <span>🎤</span> Songbook Lyrics
          </button>

          <button id="btnTestAudio" class="btn-cta-secondary px-4 h-14">
            🔔 Test Note
          </button>

          <div class="badge" id="audioBadge">
            <span class="badge-dot" id="audioDot"></span>
            <span id="audioStatusText">Idle</span>
          </div>
        </div>

      </div>
    </div>
  </header>

  <!-- Hero Splash Screen with Ferrofluid Background -->
  <div class="modal-backdrop" id="startModal">
    <!-- Live Interactive Ferrofluid WebGL Canvas Background -->
    <div id="ferrofluidContainer" class="ferrofluid-modal-bg"></div>

    <!-- Hero Content -->
    <div class="hero-content">
      <!-- Giant Bold Headline -->
      <h1 class="hero-title">Welcome to Rhythmos</h1>

      <p class="hero-subtitle">
        Hover your index finger over the chromatic note wheel on the right side of the screen to play real-time musical notes cleanly in thin air.
      </p>

      <!-- Hero Button Pair -->
      <div class="hero-actions">
        <button id="btnStartApp" class="hero-btn-primary">
          Get started
        </button>
        <button id="btnLearnMore" class="hero-btn-secondary">
          Learn more
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
